<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정신과 의사의 모험 — JMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html,body{margin:0;padding:0;height:100%;background:#04101c;overflow:hidden;

  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#0a2236,#04101c 80%);}
  #stage{line-height:0;box-shadow:0 18px 60px rgba(0,0,0,.6);border-radius:6px;overflow:hidden;}
  #stage canvas{display:block;}
  #loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#29dbe0;font-family:'Jua',sans-serif;gap:14px;z-index:50;}
  #loading .t{font-size:26px;letter-spacing:2px;}
  #loading .s{font-size:14px;color:#7fd6da;opacity:.8}
  .spin{width:40px;height:40px;border:4px solid #143; border-top-color:#29dbe0;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>

// ============================================================
//  AUDIO  (WebAudio 절차적 SFX — 저작권 무관, 자체 생성)

const Audio2 = (()=> {
  let ctx=null, master=null, muted=false;
  function ensure(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0.32; master.connect(ctx.destination);}
    if(ctx.state==='suspended') ctx.resume(); }
  function tone(freq,dur,type='square',vol=0.5,glide=0){ if(muted)return; ensure();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    if(glide)o.frequency.linearRampToValueAtTime(freq+glide,ctx.currentTime+dur);
    g.gain.value=0.0001; g.gain.exponentialRampToValueAtTime(vol,ctx.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ctx.currentTime+dur+0.02); }
  function noise(dur,vol=0.4,hp=800){ if(muted)return; ensure();
    const n=ctx.createBufferSource(); const b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);
    n.buffer=b; const f=ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
    const g=ctx.createGain(); g.gain.value=vol; g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    n.connect(f); f.connect(g); g.connect(master); n.start(); n.stop(ctx.currentTime+dur); }
  // ---- 절차적 BGM (앰비언트 루프, 저작권 무관) ----
  let musicBus=null, musicOn=false, schedTimer=null, stepIdx=0, nextTime=0;
  const MUSIC_VOL=0.85, BPM=72, STEP=(60/BPM)/2, BARSTEPS=8;  // 8분음표 단위
  const mtof=(m)=>440*Math.pow(2,(m-69)/12);
  // Am - F - C - G  (vi-IV-I-V): 차분하고 살짝 미스터리한 진료실 무드
  const CHORDS=[
    {pad:[57,60,64], bass:45, arp:[57,60,64,69]},  // Am
    {pad:[53,57,60], bass:41, arp:[53,57,60,65]},  // F
    {pad:[60,64,67], bass:48, arp:[60,64,67,72]},  // C
    {pad:[55,59,62], bass:43, arp:[55,59,62,67]},  // G
  ];
  function padNote(freq,t,dur){
    const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o2.type='triangle'; o.frequency.value=freq; o2.frequency.value=freq*2.003;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.10,t+0.7);
    g.gain.setValueAtTime(0.10,t+dur-0.9);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); o2.connect(g); g.connect(musicBus);
    o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05); }
  function arpNote(freq,t){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.055,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+0.55); }
  function bassNote(freq,t,dur){
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.13,t+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dur+0.05); }
  function scheduleStep(i,t){
    const chord=CHORDS[Math.floor(i/BARSTEPS)%CHORDS.length], local=i%BARSTEPS;
    if(local===0){ chord.pad.forEach(m=>padNote(mtof(m),t,STEP*BARSTEPS)); bassNote(mtof(chord.bass),t,STEP*4*0.9); }
    if(local===4){ bassNote(mtof(chord.bass),t,STEP*4*0.9); }
    if(local%2===0){ arpNote(mtof(chord.arp[(local/2)%chord.arp.length]),t); } }
  function tick(){ if(!musicOn||!ctx)return;
    while(nextTime < ctx.currentTime+0.5){ scheduleStep(stepIdx,nextTime); nextTime+=STEP; stepIdx++; } }
  return {
    blip(){ tone(420+Math.random()*60,0.045,'square',0.16); },
    blipLow(){ tone(240+Math.random()*40,0.05,'square',0.14); },
    ding(){ tone(880,0.12,'triangle',0.4); tone(1320,0.16,'sine',0.25); },
    pick(){ tone(660,0.07,'square',0.3,120); },
    drop(){ tone(330,0.09,'sine',0.4); noise(0.05,0.12,1200); },
    buzz(){ tone(150,0.3,'sawtooth',0.4,-40); },
    stamp(){ tone(90,0.18,'sine',0.7); noise(0.18,0.5,300); },
    page(){ noise(0.12,0.18,2000); },
    jingle(){ const s=[523,659,784,1046]; s.forEach((f,i)=>setTimeout(()=>{tone(f,0.18,'triangle',0.4); tone(f*2,0.18,'sine',0.18);}, i*110)); },
    sad(){ const s=[392,330,294,247]; s.forEach((f,i)=>setTimeout(()=>tone(f,0.22,'sine',0.32), i*140)); },
    startMusic(){ ensure(); if(musicOn)return;
      if(!musicBus){ musicBus=ctx.createGain(); musicBus.connect(master); }
      musicBus.gain.setTargetAtTime(muted?0.0001:MUSIC_VOL, ctx.currentTime, 0.4);
      musicOn=true; stepIdx=0; nextTime=ctx.currentTime+0.15;
      if(!schedTimer) schedTimer=setInterval(tick,60); },
    stopMusic(){ musicOn=false; if(schedTimer){clearInterval(schedTimer); schedTimer=null;}
      if(musicBus&&ctx) musicBus.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.4); },
    duckMusic(level=0.3){ if(musicBus&&ctx&&musicOn&&!muted) musicBus.gain.setTargetAtTime(MUSIC_VOL*level, ctx.currentTime, 0.5); },
    toggleMute(){ muted=!muted;
      if(musicBus&&ctx) musicBus.gain.setTargetAtTime((muted||!musicOn)?0.0001:MUSIC_VOL, ctx.currentTime, 0.15);
      return muted; },
    isMuted(){ return muted; }, ensure
  };
})();

// ---- 미니 트윈 -------------------------------------------------
function tween(obj, props, dur, ease, onDone){
  const start={}, t0=performance.now(); ease=ease||(t=>t);
  for(const k in props) start[k]=getProp(obj,k);
  G.tween.push({obj,props,start,dur,t0,ease,onDone});
}
function getProp(o,k){ if(k==='x')return o.x; if(k==='y')return o.y;
  if(k==='sx')return o.scale.x; if(k==='sy')return o.scale.y;
  if(k==='alpha')return o.alpha; if(k==='rot')return o.rotation; return o[k]; }
function setProp(o,k,v){ if(k==='x')o.x=v; else if(k==='y')o.y=v;
  else if(k==='sx')o.scale.x=v; else if(k==='sy')o.scale.y=v;
  else if(k==='alpha')o.alpha=v; else if(k==='rot')o.rotation=v; else o[k]=v; }
function tickTweens(){ const now=performance.now();
  for(let i=G.tween.length-1;i>=0;i--){ const tw=G.tween[i];
    let p=(now-tw.t0)/tw.dur; if(p>=1)p=1; const e=tw.ease(p);
    for(const k in tw.props) setProp(tw.obj,k, tw.start[k]+(tw.props[k]-tw.start[k])*e);
    if(p>=1){ G.tween.splice(i,1); if(tw.onDone)tw.onDone(); } } }
const Ease={ out:t=>1-Math.pow(1-t,3), in:t=>t*t*t,
  outBack:t=>{const c=1.7;return 1+ (c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);},
  outElastic:t=>{ if(t===0||t===1)return t; const p=0.4; return Math.pow(2,-10*t)*Math.sin((t-p/4)*(2*Math.PI)/p)+1;} };

// ---- 텍스트/그래픽 헬퍼 ---------------------------------------
function T(str,opt){ return new PIXI.Text(str, Object.assign({
  fontFamily:FONT.body, fontSize:20, fill:COL.white }, opt)); }
function rrect(g,x,y,w,h,r,fill,fa){ g.beginFill(fill, fa==null?1:fa); g.drawRoundedRect(x,y,w,h,r); g.endFill(); return g; }
function strokeRR(g,x,y,w,h,r,col,lw,a){ g.lineStyle(lw,col,a==null?1:a); g.drawRoundedRect(x,y,w,h,r); g.lineStyle(0); return g; }

// ---- 버튼 ------------------------------------------------------
function button(label, w, h, opt){
  opt=opt||{}; const c=new PIXI.Container(); c.eventMode='static'; c.cursor='pointer'; c._noAdvance=true;
  const g=new PIXI.Graphics(); c.addChild(g);
  const fill=opt.fill!=null?opt.fill:COL.cyanDeep, edge=opt.edge!=null?opt.edge:COL.cyan;
  function draw(hover,press){ g.clear();
    rrect(g,0,press?2:0,w,h,opt.r!=null?opt.r:10, hover?lighten(fill,18):fill);
    strokeRR(g,0,press?2:0,w,h,opt.r!=null?opt.r:10, edge,2.5); }
  draw(false,false);
  const tx=T(label,{fontFamily:opt.font||FONT.hard, fontSize:opt.fs||20, fill:opt.tcol!=null?opt.tcol:COL.white});
  tx.anchor.set(0.5); tx.position.set(w/2,h/2); c.addChild(tx);
  c.on('pointerover',()=>draw(true,false)); c.on('pointerout',()=>draw(false,false));
  c.on('pointerdown',()=>{draw(true,true); tx.y=h/2+2;});
  c.on('pointerup',()=>{draw(true,false); tx.y=h/2; Audio2.pick(); opt.onClick&&opt.onClick();});
  c.on('pointerupoutside',()=>{draw(false,false); tx.y=h/2;});
  c._setLabel=(s)=>tx.text=s; c._tx=tx; c._w=w; c._h=h; return c;
}
function lighten(hex,amt){ let r=(hex>>16)&255,g=(hex>>8)&255,b=hex&255;
  r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt); return (r<<16)|(g<<8)|b; }

function registerZone(z){ G.dropzones.push(z); return z; }
function clearZones(){ G.dropzones.length=0; }
function beginDrag(tok,e){
  if(G.state==='verdict')return;
  Audio2.pick(); G.dragging=tok; const p=e.global;
  const gp=tok.getGlobalPosition(); tok._dx=p.x-gp.x; tok._dy=p.y-gp.y;
  if(tok._inSlot){ const s=tok._inSlot; s._token=null; s._ph.visible=true; s._draw&&s._draw(false); tok._inSlot=null; updateSubmitState(); }
  tok._home={parent:G.trayFlow,x:0,y:0};
  layers.drag.addChild(tok); tok.position.set(p.x-tok._dx,p.y-tok._dy); tok.scale.set(1.08);
}
function endDrag(){
  const tok=G.dragging; if(!tok)return; G.dragging=null; tok.scale.set(1);
  const gp=tok.getGlobalPosition(); const cx=gp.x+tok._w*0.5, cy=gp.y+tok._h*0.5;
  let hit=null;
  for(const z of G.dropzones){ const r=z.rectGlobal();
    if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h){ if(!z.accept||z.accept(tok)){ hit=z; break; } } }
  if(hit){ hit.onDrop(tok); } else { returnHome(tok); }
}
function returnHome(tok){ tok.scale.set(1);
  if(G.trayFlow) G.trayFlow.addChild(tok); layoutTray(); }
function updateSubmitState(){ /* 최종 승인 버튼은 항상 활성, 검증으로 피드백 */ }

function doAdvance(){ const t=performance.now(); if(t-(G._lastAdv||0)<140) return; G._lastAdv=t;
  if(G.dialogue && G.dialogue.visible && G.dialogue._onAdvance) G.dialogue._onAdvance(); }
function onStageTap(e){
  if(!G.advanceClickEnabled || G.enc) return;           // 백과 모달 열림/비활성 시 무시
  let n=e.target; while(n){ if(n._noAdvance) return; n=n.parent; }   // 버튼·화살표·토큰 등은 제외
  doAdvance();
}

let _typeTimer=null;
function say(speaker, text, opts){
  opts=opts||{}; const d=G.dialogue; d.visible=true; G.advanceClickEnabled=true;
  d._setName(speaker||'');
  d._prompt.visible=false; d._arrowL.visible=!!opts.nav; d._arrowR.visible=!!opts.nav;
  d._onAdvance=null;
  const body=d._body; body.text=''; let i=0; const full=text; let done=false;
  if(_typeTimer)clearInterval(_typeTimer);
  function finish(){ done=true; body.text=full; clearInterval(_typeTimer); _typeTimer=null;
    d._prompt.visible=(opts.mode!=='none'); if(opts.onDone)opts.onDone(); }
  _typeTimer=setInterval(()=>{ if(i>=full.length){ finish(); return; }
    const ch=full[i++]; body.text+=ch; if(ch.trim()&&i%2===0)Audio2.blip(); }, 26);
  d._onAdvance=()=>{ if(!done){ finish(); } else { d._prompt.visible=false;
      if(opts.next) opts.next(); } };
  d._prompt.text=opts.promptText||'클릭하여 다음으로 ▶▶▶';
  d._prompt.x=DB.x+DB.w-d._prompt.width-22;
}

// ---- 스크립트 러너 -------------------------------------------
function runScript(lines, onEnd){
  let k=0;
  function step(){ if(k>=lines.length){ onEnd&&onEnd(); return; }
    const L=lines[k++]; if(L.scene) setScene(L.scene);
    if(L.smile!==undefined && G.curScene && G.curScene.startsWith('nurse')) setScene(L.smile?'nurse_smile':'nurse_calm');
    say(L.who, L.txt, {mode:'advance', next:step, promptText:(k>=lines.length?'클릭하여 시작 ▶':'클릭하여 다음으로 ▶▶▶')});
  }
  step();
}

function createToken(data){
  const c=new PIXI.Container(); c.eventMode='static'; c.cursor='grab'; c._noAdvance=true;
  const col = data.kind==='disease'?COL.diseaseTok : data.kind==='drug'?COL.drugTok : COL.symTok;
  const edge= data.kind==='disease'?COL.diseaseEdge: data.kind==='drug'?COL.drugEdge: COL.symEdge;
  const icon= data.kind==='disease'?'🩺 ':data.kind==='drug'?'💊 ':'🗨 ';
  const tx=T(icon+data.label,{fontFamily:FONT.hard,fontSize:16,fill:COL.white}); tx.position.set(13,6);
  const w=Math.ceil(tx.width)+26, h=30;
  const g=new PIXI.Graphics(); rrect(g,0,0,w,h,8,col); strokeRR(g,0,0,w,h,8,edge,2);
  c.addChild(g); c.addChild(tx); c._w=w; c._h=h; c._data=data; c._kind=data.kind;
  c.on('pointerdown',e=>beginDrag(c,e));
  c.on('pointerover',()=>{ if(G.dragging!==c) c.scale.set(1.04); });
  c.on('pointerout',()=>{ if(G.dragging!==c) c.scale.set(1); });
  return c;
}
function buildClueTray(){
  const c=new PIXI.Container(); c.position.set(24,572); layers.tokens.addChild(c); G.tray=c;
  const g=new PIXI.Graphics(); rrect(g,0,0,570,96,12,0x081a29,0.94); strokeRR(g,0,0,570,96,12,COL.cyanDim,2);
  c.addChild(g);
  const t=T('🔑 확보한 단서   ·   드래그해서 기록부에 붙이세요',{fontFamily:FONT.hard,fontSize:15,fill:0x9fe0e4});
  t.position.set(14,9); c.addChild(t);
  const empty=T('아직 단서가 없습니다. 환자와 대화하며 ◀ ▶ 로 살펴보세요.',{fontFamily:FONT.body,fontSize:14,fill:0x5f8893});
  empty.position.set(14,52); c.addChild(empty); G.trayEmpty=empty;
  const flow=new PIXI.Container(); flow.position.set(14,40); c.addChild(flow); G.trayFlow=flow;
}
function addClue(data){
  if(G.clueTokens.some(t=>t.id===data.id)) return false;
  data._token=createToken(data); G.clueTokens.push(data);
  G.trayFlow.addChild(data._token); if(G.trayEmpty)G.trayEmpty.visible=false; layoutTray(); return true;
}
function layoutTray(){
  let x=0,y=0;
  for(const d of G.clueTokens){ const tk=d._token; if(tk._inSlot) continue;
    if(x+tk._w>544){ x=0; y+=34; }
    tk._home={parent:G.trayFlow,x,y};
    if(G.dragging!==tk){ if(tk.parent!==G.trayFlow)G.trayFlow.addChild(tk); tk.position.set(x,y); }
    x+=tk._w+10; }
}
function flashText(str,col,y){
  const t=T(str,{fontFamily:FONT.black,fontSize:30,fill:col,stroke:0x06222b,strokeThickness:5});
  t.anchor.set(0.5); t.position.set(SW.x+SW.w/2,(y||SW.y+96)); t.alpha=0; layers.fx.addChild(t);
  tween(t,{alpha:1,y:t.y-12},160,Ease.out,()=>tween(t,{alpha:0,y:t.y-34},560,Ease.in,()=>t.destroy()));
}

    d._arrowL.on('pointertap',()=>moveInvest(-1));
    d._arrowR.on('pointertap',()=>moveInvest(1)); }
}
function moveInvest(dir){ const n=G.case.statements.length;
  G.invest.idx=(G.invest.idx+dir+n)%n; Audio2.blipLow(); renderStatement(); }
let _captureChip=null;
function renderStatement(){
  hideCapture(); const s=G.case.statements[G.invest.idx];
  const counter='('+(G.invest.idx+1)+'/'+G.case.statements.length+')';
  say(G.case.patientName, s.txt, {mode:'nav', nav:true,
    promptText:'◀   환자의 말을 살펴보세요   ▶   '+counter,
    onDone:()=>{ if(s.sym) showCapture(s); }});
}
function showCapture(s){
  hideCapture();
  const captured=G.clueTokens.some(t=>t.id===s.kid);
  const c=new PIXI.Container(); _captureChip=c; G.dialogue.addChild(c); c._noAdvance=true;
  c.position.set(DB.x+24, DB.y+DB.h-40);
  const label=captured?('✓ 확보됨 :  「'+s.key+'」'):('🔍  단서 확보 :  「'+s.key+'」');
  const tx=T(label,{fontFamily:FONT.hard,fontSize:16,fill:captured?COL.good:COL.white}); tx.position.set(14,7);
  const w=Math.ceil(tx.width)+28;
  const g=new PIXI.Graphics(); rrect(g,0,0,w,32,9,captured?0x0c3a2c:COL.keyDeep); strokeRR(g,0,0,w,32,9,captured?COL.good:COL.key,2);
  c.addChild(g); c.addChild(tx);
  if(!captured){ c.eventMode='static'; c.cursor='pointer';
    let pulse=0; c._pulse=app.ticker.add(()=>{ pulse+=0.08; c.alpha=0.82+Math.sin(pulse)*0.18; });
    c.on('pointertap',()=>captureClue(s)); }
}
function hideCapture(){ if(_captureChip){ if(_captureChip._pulse)app.ticker.remove(_captureChip._pulse); _captureChip.destroy(); _captureChip=null; } }
function captureClue(s){ Audio2.ding();
  if(addClue({kind:'symptom', id:s.kid, label:s.key, leadsTo:s.leadsTo})) flashText('단서 확보!', COL.good);
  showCapture(s);
}

// ============================================================
//  환자기록부 (진단 보드)
// ============================================================
const FX=610,FY=64,FW=664,FH=606;
function makeSlot(x,y,w,h,kind,placeholder,parent){
  const s=new PIXI.Container(); s.position.set(x,y); parent.addChild(s);
  const g=new PIXI.Graphics(); s.addChild(g); s._w=w; s._h=h; s._kind=kind; s._token=null;
  function draw(hi){ g.clear(); rrect(g,0,0,w,h,7,hi?COL.slotHi:COL.slot);
    g.lineStyle(2,hi?COL.gold:COL.slotEdge,1); g.drawRoundedRect(0,0,w,h,7); g.lineStyle(0); }
  draw(false); s._draw=draw;
  const ph=T(placeholder,{fontFamily:FONT.body,fontSize:13,fill:0x9aa6a0}); ph.position.set(12,h/2-9); s.addChild(ph); s._ph=ph;
  registerZone({ id:'slot',
    rectGlobal:()=>{ const p=s.getGlobalPosition(); return {x:p.x,y:p.y,w:w,h:h}; },
    accept:(tk)=>!s._token && (kind==='any'? true : tk._kind===kind),
    onDrop:(tk)=>placeInSlot(s,tk),
    hover:(on)=>draw(on) });
  return s;
}
function placeInSlot(s,tk){
  if(s._token && s._token!==tk) freeToken(s._token);
  tk._inSlot=s; s._token=tk;
  s.addChild(tk); tk.scale.set(1);
  tk.position.set((s._w-tk._w)/2,(s._h-tk._h)/2);
  s._ph.visible=false; s._draw(false); Audio2.drop(); layoutTray(); updateSubmitState();
}
function freeToken(tk){ const s=tk._inSlot; if(s){ s._token=null; s._ph.visible=true; s._draw(false);} tk._inSlot=null; if(G.trayFlow)G.trayFlow.addChild(tk); layoutTray(); }
function makeCheck(x,y,label,val,parent){
  const c=new PIXI.Container(); c.position.set(x,y); parent.addChild(c); c.eventMode='static'; c.cursor='pointer'; c._noAdvance=true;
  const g=new PIXI.Graphics(); c.addChild(g);
  const tx=T(label,{fontFamily:FONT.hard,fontSize:18,fill:COL.ink}); tx.position.set(30,0); c.addChild(tx);
  function draw(){ g.clear(); g.lineStyle(2,COL.inkSoft,1); g.beginFill(0xffffff); g.drawRoundedRect(0,1,24,24,5); g.endFill();
    if(G.board && G.board.severity===val){ g.lineStyle(0); g.beginFill(COL.good); g.drawRoundedRect(4,5,16,16,3); g.endFill();
      g.lineStyle(3,0xffffff,1); g.moveTo(7,13); g.lineTo(11,17); g.lineTo(18,8); g.lineStyle(0);} }
  draw(); c._draw=draw;
  c.on('pointertap',()=>{ G.board.severity=(G.board.severity===val?null:val); G.board.sevBoxes.forEach(b=>b._draw()); Audio2.pick(); });
  return c;
}
function buildFolder(c0){
  clearRight(); clearZones(); const c=layers.right;
  G.board={ treatSlots:[], diagSlot:null, drugSlot:null, severity:null, sevBoxes:[] };
  // 노란 탭 + 종이
  const tab=new PIXI.Graphics(); rrect(tab,FX+18,FY-24,180,40,8,COL.yellow); strokeRR(tab,FX+18,FY-24,180,40,8,COL.yellowEdge,3); c.addChild(tab);
  const paper=new PIXI.Graphics(); rrect(paper,FX,FY,FW,FH,12,COL.paper); strokeRR(paper,FX,FY,FW,FH,12,COL.yellowEdge,4); c.addChild(paper);
  G.folderRoot=c;
  // 헤더
  const title=T('환자기록부',{fontFamily:FONT.hard,fontSize:34,fill:0x243640}); title.anchor.set(0.5,0); title.position.set(FX+FW/2,FY+16); c.addChild(title);
  const r=c0.record;
  const info=T('이름: '+r.name+' ('+r.sexAge+')      직업: '+r.job,{fontFamily:FONT.body,fontSize:16,fill:0x41535c}); info.anchor.set(0.5,0); info.position.set(FX+FW/2,FY+60); c.addChild(info);
  const reason=T('내방 이유:  '+r.reason,{fontFamily:FONT.hard,fontSize:17,fill:COL.redDeep}); reason.anchor.set(0.5,0); reason.position.set(FX+FW/2,FY+86); c.addChild(reason);
  const dv=new PIXI.Graphics(); dv.lineStyle(2,COL.paperLine,1); dv.moveTo(FX+24,FY+118); dv.lineTo(FX+FW-24,FY+118); c.addChild(dv);
  // 치료
  const PX=FX+26;
  lab('치료',PX,FY+138,c);
  const tHint=T('환자 대화 단서를 여기로 드래그',{fontFamily:FONT.body,fontSize:12,fill:0xa9b3ad}); tHint.position.set(PX+72,FY+148); c.addChild(tHint);
  const sy=FY+168, slotW=420, slotX=PX+86;
  for(let i=0;i<4;i++){ const s=makeSlot(slotX,sy+i*40,slotW,32,'symptom','환자 대화 키워드 여기로 드래그',c); G.board.treatSlots.push(s); }
  // 진단
  const dy=sy+4*40+14;
  lab('진단',PX,dy+4,c);
  G.board.diagSlot=makeSlot(slotX,dy,250,34,'disease','질병 키워드 여기로 드래그',c);
  G.board.sevBoxes.push(makeCheck(slotX+268,dy+5,'초기','초기',c));
  G.board.sevBoxes.push(makeCheck(slotX+346,dy+5,'중기','중기',c));
  // 처방
  const py=dy+58;
  lab('처방',PX,py+4,c);
  G.board.drugSlot=makeSlot(slotX,py,250,34,'drug','약물 키워드 여기로 드래그',c);
  // 최종 승인
  const sub=button('최  종  승  인',FW-52,54,{fill:0x2b4a5a,edge:COL.cyan,fs:24,font:FONT.hard,onClick:submitDiagnosis});
  sub.position.set(FX+26,FY+FH-72); c.addChild(sub); G.board.submitBtn=sub;
  G.board.stampAnchor={x:FX+FW/2,y:FY+FH/2};
}
function lab(txt,x,y,c){ const t=T(txt,{fontFamily:FONT.hard,fontSize:23,fill:0x243640}); t.position.set(x,y); c.addChild(t); return t; }
function shakeFolder(){ const c=G.folderRoot; if(!c)return; const x0=c.x;
  let n=0; const iv=setInterval(()=>{ c.x=x0+(n%2?-1:1)*8; if(++n>6){clearInterval(iv);c.x=x0;} },40); }

// ============================================================
//  검증 / 제출
// ============================================================
// __SUBMIT_START__
function submitDiagnosis(){
  if(G.state!=='consult')return; const b=G.board, ans=G.case.answer, fb=G.case.feedback;
  const syms=b.treatSlots.filter(s=>s._token && (!ans.symIds || ans.symIds.indexOf(s._token._data.id)>=0)).length;
  const diag=b.diagSlot._token?b.diagSlot._token._data.label:null;
  const drug=b.drugSlot._token?b.drugSlot._token._data.label:null;
  if(syms<ans.minSymptoms) return reject(fb.needClues);
  if(!diag || diag.indexOf(ans.disease)<0){
    if(diag && fb.diagSpecial){ for(const sp of fb.diagSpecial){ if(diag.indexOf(sp.match)>=0) return reject(sp.msg); } }
    return reject(fb.wrongDiag);
  }
  if(!b.severity) return reject(fb.sevMissing);
  if(b.severity!==ans.severity) return reject(fb.sevWrong);
  if(!drug || drug.indexOf(ans.drug)<0) return reject(fb.wrongDrug);
  approve();
}
// __SUBMIT_END__
function reject(msg){ Audio2.buzz(); shakeFolder(); flashText('오진!', COL.red);
  say('한석지', msg, {mode:'advance', next:()=>renderStatement()}); }

// ============================================================
//  의료지식백과 (Encyclopedia) — 드래그 조회
// ============================================================
function openEncyclopedia(){
  if(G.enc) return; Audio2.page();
  const m=layers.modal; const c=new PIXI.Container(); m.addChild(c); G.enc=c;
  const dim=new PIXI.Graphics(); rrect(dim,0,0,VW,VH,0,0x02080f,0.55); dim.eventMode='static'; c.addChild(dim);
  const PWi=660,PH=560,PXm=(VW-PWi)/2,PYm=80;
  const panel=new PIXI.Graphics(); rrect(panel,PXm,PYm,PWi,PH,12,0xf2fbfb); strokeRR(panel,PXm,PYm,PWi,PH,12,COL.gold,4); c.addChild(panel);
  const head=new PIXI.Graphics(); rrect(head,PXm,PYm,PWi,48,12,COL.cyan); rrect(head,PXm,PYm+24,PWi,24,0,COL.cyan); c.addChild(head);
  const ht=T('의료지식백과',{fontFamily:FONT.hard,fontSize:24,fill:0x06363a}); ht.anchor.set(0.5); ht.position.set(VW/2,PYm+24); c.addChild(ht);
  const close=button('✕',38,34,{fill:COL.red,edge:0xff8a8a,r:7,fs:18,onClick:closeEncyclopedia}); close.position.set(PXm+PWi-50,PYm+7); c.addChild(close);
  // 책 아이콘 + 드롭존
  const dzX=PXm+24,dzY=PYm+64,dzW=PWi-48,dzH=72;
  const book=T('📖',{fontSize:40}); book.position.set(dzX+6,dzY+12); c.addChild(book);
  const dz=new PIXI.Graphics(); c.addChild(dz);
  function drawDz(hi){ dz.clear(); rrect(dz,dzX+70,dzY,dzW-70,dzH,10,hi?COL.slotHi:0xeafafa); dz.lineStyle(2.5,hi?COL.gold:COL.cyanDim,1); dz.drawRoundedRect(dzX+70,dzY,dzW-70,dzH,10); if(hi)dz.lineStyle(0); }
  drawDz(false);
  const dzt=T('여기에 단서를 드래그 & 드랍하기',{fontFamily:FONT.hard,fontSize:17,fill:0x4b6168}); dzt.anchor.set(0.5); dzt.position.set(dzX+70+(dzW-70)/2,dzY+dzH/2); c.addChild(dzt);
  // 본문 영역
  const bodyTitle=T('',{fontFamily:FONT.hard,fontSize:22,fill:0x1f6f74}); bodyTitle.position.set(dzX,dzY+92); c.addChild(bodyTitle);
  const body=T('단서(증상)를 위 칸에 드래그하면\n관련 질병과 처방이 표시됩니다.',{fontFamily:FONT.body,fontSize:16,fill:0x33474e,wordWrap:true,wordWrapWidth:PWi-60,lineHeight:25}); body.position.set(dzX,dzY+124); c.addChild(body);
  G.encRefs={bodyTitle,body,dzt};
  // 드롭존 등록
  G.encZone={ id:'enc', rectGlobal:()=>({x:dzX+70,y:dzY,w:dzW-70,h:dzH}),
    accept:(tk)=>tk._kind==='symptom', onDrop:(tk)=>{ lookupSymptom(tk); returnHome(tk); }, hover:(on)=>drawDz(on) };
  G.dropzones.unshift(G.encZone);
  // 트레이를 모달 위로 올려 드래그 가능
  if(G.tray){ c.addChild(G.tray); }
  c.alpha=0; tween(c,{alpha:1},180,Ease.out);
  if(G.encBtn)G.encBtn.visible=false;
}
function lookupSymptom(tok){
  const r=G.encRefs; if(!r) return;
  const key=(tok&&tok._data&&tok._data.leadsTo)||'depression';
  const dis=KB.diseases[key]; if(!dis) return;
  r.dzt.text='✓ 「'+dis.lookupTitle+'」 조회 완료';
  r.bodyTitle.text=dis.name;
  r.body.text=dis.body;
  Audio2.ding();
  // 질병/처방 키워드 잠금 해제 (백과 항목별 1회)
  if(!G.unlocked[key]){ G.unlocked[key]=true;
    addClue({kind:'disease',id:dis.dxId,label:dis.dxLabel});
    addClue({kind:'drug',id:dis.rxId,label:dis.rxLabel});
    const msg='📌 「'+dis.dxShort+'」 진단 · 「'+dis.drugName+'」 처방 키워드를 단서로 확보했습니다!';
    if(G.encNote && !G.encNote.destroyed){ G.encNote.text=msg; }
    else { const note=T(msg,{fontFamily:FONT.hard,fontSize:15,fill:COL.redDeep,wordWrap:true,wordWrapWidth:560});
      note.position.set((VW-660)/2+24, 80+560-58); G.enc.addChild(note); G.encNote=note; }
  }
}
function closeEncyclopedia(){
  if(!G.enc)return; G.dropzones=G.dropzones.filter(z=>z!==G.encZone); G.encZone=null;
  if(G.tray){ layers.tokens.addChild(G.tray); }
  const c=G.enc; G.enc=null; G.encNote=null; tween(c,{alpha:0},160,Ease.out,()=>{ c.destroy({children:true}); });
  if(G.encBtn)G.encBtn.visible=true; layoutTray();
}

// ============================================================
//  판결: 배지 컷씬 → APPROVED 스탬프 → 결과 → 엔딩
// ============================================================
function approve(){
  G.state='verdict'; G.advanceClickEnabled=false; hideCapture(); if(G.enc)closeEncyclopedia();
  if(G.encBtn)G.encBtn.eventMode='none';
  Audio2.duckMusic(); Audio2.jingle();
  say('이현종','…좋습니다. 진단을 확정하겠습니다.',{mode:'none'});
  playBadgeCutscene(()=> stampApproved(()=> showResult()));
}
function playBadgeCutscene(done){
  const fx=layers.fx;
  const dim=new PIXI.Graphics(); rrect(dim,SW.x,SW.y,SW.w,SW.h,8,0x04101c,1); dim.alpha=0; fx.addChild(dim); tween(dim,{alpha:0.5},320);
  const tex=TEX.badge;
  if(!tex){ done&&done(); return; }
  const sp=new PIXI.Sprite(tex); const s=Math.min(SW.w/tex.width,SW.h/tex.height)*0.92; sp.scale.set(s);
  sp.anchor.set(0.5,0); sp.position.set(SW.x+SW.w/2,SW.y+SW.h+10);
  const mask=new PIXI.Graphics(); rrect(mask,SW.x,SW.y,SW.w,SW.h,8,0xffffff); fx.addChild(mask); sp.mask=mask;
  fx.addChild(sp); Audio2.drop();
  tween(sp,{y:SW.y+24},680,Ease.outBack,()=> setTimeout(()=>done&&done(),420));
}
function stampApproved(done){
  const c=layers.fx, a=G.board.stampAnchor;
  const st=new PIXI.Container(); st.position.set(a.x,a.y); st.rotation=-0.24; c.addChild(st); G._stamp=st;
  const g=new PIXI.Graphics(); g.lineStyle(7,COL.red,0.92); g.drawRoundedRect(-156,-48,312,96,12);
  g.lineStyle(3,COL.red,0.85); g.drawRoundedRect(-146,-40,292,80,9); st.addChild(g);
  const tx=T('APPROVED',{fontFamily:FONT.black,fontSize:56,fill:COL.red}); tx.anchor.set(0.5); st.addChild(tx);
  st.scale.set(3.4); st.alpha=0; tween(st,{alpha:1},120,Ease.out);
  tween(st,{sx:1,sy:1},300,Ease.in,()=>{ Audio2.stamp(); shakeFolder(); setTimeout(()=>done&&done(),760); });
}
function showResult(){
  const c=layers.fx; const cx=FX+FW/2;
  function pop(node,delay){ node.scale.set(0.6); node.alpha=0;
    setTimeout(()=>{ tween(node,{sx:1,sy:1,alpha:1},320,Ease.outBack); Audio2.ding(); }, delay); }
  function greenBar(text,y,w,h,fs){ const cc=new PIXI.Container(); cc.position.set(cx,y); c.addChild(cc);
    const g=new PIXI.Graphics(); rrect(g,-w/2,-h/2,w,h,7,COL.good); strokeRR(g,-w/2,-h/2,w,h,7,0x12824f,2); cc.addChild(g);
    const t=T(text,{fontFamily:FONT.black,fontSize:fs,fill:0x0c3a22,stroke:COL.gold,strokeThickness:fs>34?4:0}); t.anchor.set(0.5); cc.addChild(t); return cc; }
  pop(greenBar(G.case.date+'   ·   환자 '+G.case.patientName+' 진단 결과',150,520,44,21),120);
  pop(greenBar('정확한 진단!   ( '+G.case.answer.severity+' )',236,470,72,40),520);
  pop(greenBar('약물 치료 성공!',320,420,68,38),920);
  // 흰색 후속 안내
  const sub=new PIXI.Container(); sub.position.set(cx,408); c.addChild(sub);
  const sg=new PIXI.Graphics(); rrect(sg,-300,-34,600,68,8,COL.white); strokeRR(sg,-300,-34,600,68,8,0x2659d6,2); sub.addChild(sg);
  const stx=T(G.case.result.sub,{fontFamily:FONT.hard,fontSize:18,fill:0x21323d,align:'center',lineHeight:26}); stx.anchor.set(0.5); sub.addChild(stx);
  pop(sub,1320);
  // 다음 버튼

  nb.position.set(cx-150,486); c.addChild(nb); pop(nb,1700);
  flashText('치료 성공!',COL.good,SW.y+110);
}
function ending(){
  G.state='end'; const c=layers.top; c.removeChildren(); c.visible=true;
  const cs=G.case||CASES[0];
  const ov=new PIXI.Graphics(); rrect(ov,0,0,VW,VH,0,0x04101c,0.94); c.addChild(ov);
  const t1=T('🩺  오늘의 진료를 마칩니다',{fontFamily:FONT.black,fontSize:46,fill:COL.white}); t1.anchor.set(0.5); t1.position.set(VW/2,VH/2-96); c.addChild(t1);
  const t2=T('수고하셨습니다, 이현종 선생님.',{fontFamily:FONT.hard,fontSize:26,fill:COL.cyan}); t2.anchor.set(0.5); t2.position.set(VW/2,VH/2-34); c.addChild(t2);
  const t3=T(cs.endingLine,{fontFamily:FONT.hard,fontSize:22,fill:COL.gold}); t3.anchor.set(0.5); t3.position.set(VW/2,VH/2+18); c.addChild(t3);
  let by=VH/2+66;
  if(cs.endingSub){ const t4=T(cs.endingSub,{fontFamily:FONT.body,fontSize:15,fill:0x9fc7cd}); t4.anchor.set(0.5); t4.position.set(VW/2,VH/2+52); c.addChild(t4); by=VH/2+86; }
  const credit=T('정신과 의사의 모험 · JMS   |   PixiJS / WebGL',{fontFamily:FONT.body,fontSize:14,fill:0x7fa6b0}); credit.anchor.set(0.5); credit.position.set(VW/2,VH-44); c.addChild(credit);
  const b=button('타이틀로 돌아가기',260,58,{fill:COL.cyanDeep,edge:COL.cyan,fs:24,font:FONT.hard,onClick:()=>location.reload()}); b.position.set(VW/2-130,by); c.addChild(b);
  Audio2.stopMusic(); Audio2.jingle();
}
